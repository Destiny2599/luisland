# ─── Servidor ───────────────────────────────────────────────────────────────
server.port=8080

# ─── JWT ────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:luisland-super-secret-key-2024-cambia-esto-en-produccion}
jwt.expiration=86400000

# ─── MySQL — HikariCP (pool explícito) ──────────────────────────────────────
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool HikariCP
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=HikariPoolMySQL

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# ─── MongoDB — pool explícito vía MongoConfig.java ──────────────────────────
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/luisland}

# Parámetros de pool (leídos por MongoConfig.java)
mongodb.pool.min-size=2
mongodb.pool.max-size=10
mongodb.pool.max-life-time-ms=1800000
mongodb.pool.max-idle-time-ms=600000
mongodb.pool.max-wait-time-ms=30000
mongodb.pool.connect-timeout-ms=10000